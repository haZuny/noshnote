<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7fafc">
  <title>NoshNote</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7fafc;
      --surface: #fff;
      --ink: #26333d;
      --muted: #737f88;
      --line: #d5dfe5;
      --green: #2588b2;
      --green-soft: #e5f4fb;
      --blue: #2588b2;
      --blue-soft: #edf8fc;
      --danger: #a84d47;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { max-width: 480px; min-height: 100vh; margin: 0 auto; padding: 0 18px 104px; }
    .topline { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: center; min-height: 60px; margin: 0 -18px 12px; padding: 10px 18px; background: rgba(247,250,252,.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); text-align: center; }
    .topline-brand-icon { position: absolute; left: 18px; width: 30px; height: 30px; object-fit: contain; }
    .topline-brand-name { position: absolute; left: 54px; color: var(--ink); font-size: 13px; font-weight: 650; letter-spacing: -.02em; }
    .brand { font-size: 20px; font-weight: 750; letter-spacing: -.035em; }
    .eyebrow { color: var(--muted); font-size: 12px; }
    .screen-stack { display: grid; }
    .screen { display: none; grid-area: 1 / 1; min-width: 0; }
    .screen.active, .screen.leaving { display: block; }
    .screen.enter-next { animation: page-in-next .28s ease-out both; }
    .screen.enter-previous { animation: page-in-previous .28s ease-out both; }
    .screen.leave-next { animation: page-out-next .28s ease-out both; }
    .screen.leave-previous { animation: page-out-previous .28s ease-out both; }
    @keyframes page-in-next { from { transform: translateX(28px); opacity: .72; } to { transform: translateX(0); opacity: 1; } }
    @keyframes page-in-previous { from { transform: translateX(-28px); opacity: .72; } to { transform: translateX(0); opacity: 1; } }
    @keyframes page-out-next { to { transform: translateX(-28px); opacity: .72; } }
    @keyframes page-out-previous { to { transform: translateX(28px); opacity: .72; } }
    h1 { font-size: 26px; letter-spacing: -.04em; line-height: 1.2; margin: 0 0 5px; }
    h2 { font-size: 17px; margin: 0; letter-spacing: -.02em; }
    p { margin: 0; }
    .subtle { color: var(--muted); font-size: 13px; }
    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 26px 0 12px; }
    .home-actions { display: flex; gap: 8px; margin: 0 0 12px; }
    .home-actions button { display: flex; align-items: center; justify-content: center; gap: 8px; flex: 1; height: 50px; padding: 0 8px; border: 1px solid #34566c; border-radius: var(--radius); color: white; background: #3c627a; font-size: 13px; font-weight: 700; box-shadow: 0 2px 5px rgba(31,62,81,.16); transition: transform .12s ease, box-shadow .12s ease, background .12s ease; }
    .home-actions button:active { background: #31566e; transform: translateY(1px); box-shadow: 0 1px 3px rgba(31,62,81,.18); }
    .action-icon { display: inline-grid; place-items: center; color: white; font-size: 17px; font-weight: 700; line-height: 1; }
    .date-switch { display: flex; align-items: center; gap: 8px; margin: 17px 0; }
    .date-switch strong { min-width: 112px; text-align: center; font-size: 14px; }
    .date-switch .icon-btn { width: 48px; height: 48px; color: var(--blue); font-size: 29px; }
    .date-switch #go-today { color: white; background: var(--blue); font-weight: 700; }
    .icon-btn, .secondary, .primary, .danger-btn { border: 0; border-radius: 12px; min-height: 42px; padding: 0 14px; }
    .icon-btn { width: 42px; padding: 0; background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 18px; }
    .primary { color: white; background: var(--green); font-weight: 650; box-shadow: 0 3px 8px rgba(56,103,132,.2), 0 1px 2px rgba(38,69,88,.1); transition: transform .12s ease, box-shadow .12s ease, background .12s ease; }
    .primary:active { background: #216e90; transform: translateY(1px); box-shadow: 0 1px 3px rgba(45,101,134,.18); }
    .secondary { color: var(--ink); background: #eef2f4; }
    .load-food-btn { color: var(--ink); background: var(--surface); border: 1px solid var(--line); font-weight: 650; }
    .danger-btn { color: var(--danger); background: #fbefee; }
    .wide { width: 100%; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 17px; box-shadow: none; }
    .summary { display: grid; gap: 16px; padding: 17px; background: var(--surface); border: 1px solid #9bcde0; box-shadow: none; }
    .summary-title { margin-bottom: 1px; font-size: 14px; font-weight: 700; }
    .metric-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .metric-name { font-size: 13px; font-weight: 650; color: #326f8b; }
    .metric-value { font-size: 17px; font-weight: 750; }
    .track { height: 6px; background: #dcebf2; border-radius: 99px; overflow: hidden; }
    .fill { height: 100%; width: 0; background: #329ac6; border-radius: inherit; transition: width .2s; }
    .fill.protein { background: #7dbcdc; }
    .remaining { display: flex; justify-content: space-between; gap: 10px; margin-top: 7px; color: var(--muted); font-size: 12px; }
    .meal-card { margin-bottom: 10px; padding: 0; overflow: hidden; }
    .meal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 15px 10px; }
    .meal-total { color: var(--muted); font-size: 12px; }
    .meal-content { padding: 0 15px 10px; }
    .empty { padding: 5px 0 9px; color: #7d878e; font-size: 13px; }
    .food-row { display: flex; align-items: center; gap: 10px; border-top: 1px solid #e5e9ec; padding: 11px 0; }
    .entry-group { margin-bottom: 9px; }
    .entry-group-list { overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .entry-card { padding: 0; margin: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    .entry-card + .entry-card { border-top: 1px solid #e5e9ec; }
    .entry-row { gap: 7px; padding: 6px 10px; border: 0; }
    .entry-row .food-info strong { line-height: 1.25; }
    .entry-row .food-info small { font-size: 11px; line-height: 1.2; }
    .entry-time { width: 38px; font-size: 11px; }
    .entry-group-title { display: flex; align-items: center; gap: 7px; margin: 10px 2px 5px; color: #326f8b; font-size: 12px; font-weight: 700; }
    .entry-group:first-child .entry-group-title { margin-top: 0; }
    .entry-group-title::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
    .food-info { flex: 1; min-width: 0; }
    .food-info strong { display: block; font-size: 14px; }
    .tag-pill { display: inline-block; margin-left: 5px; padding: 2px 7px; border-radius: 99px; background: var(--green-soft); color: var(--green); font-size: 10px; font-weight: 600; vertical-align: 1px; }
    .food-info small { color: var(--muted); font-size: 12px; }
    .food-kcal { white-space: nowrap; font-size: 12px; font-weight: 650; }
    .row-actions { display: flex; gap: 5px; }
    .tiny { border: 1px solid var(--line); color: var(--muted); background: white; border-radius: 9px; min-width: 31px; height: 31px; }
    .add-meal { width: 100%; min-height: 39px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--green); font-weight: 650; }
    .nav { position: fixed; z-index: 3; bottom: 0; left: 50%; transform: translateX(-50%); width: min(480px, 100%); display: grid; grid-template-columns: repeat(3, 1fr); padding: 10px 13px calc(10px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.97); border-top: 1px solid var(--line); backdrop-filter: blur(14px); }
    .nav button { border: 0; background: transparent; color: #7a8790; padding: 7px 3px 4px; font-size: 11px; }
    .nav button span { display: block; font-size: 18px; margin-bottom: 2px; }
    .nav button.active { color: var(--green); font-weight: 700; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; }
    .month-label { min-height: 40px; border: 0; padding: 8px 12px; border-radius: 12px; background: transparent; color: var(--ink); font: inherit; font-weight: 750; text-align: center; }
    .calendar-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0 20px; padding: 14px 16px; background: white; border: 1px solid var(--line); border-radius: 14px; }
    .calendar-stat { display: grid; gap: 3px; }
    .calendar-stat + .calendar-stat { padding-left: 14px; border-left: 1px solid var(--line); }
    .calendar-stat-label { color: var(--muted); font-size: 12px; }
    .calendar-stat strong { color: var(--ink); font-size: 20px; line-height: 1.2; }
    .calendar-stat strong small { font-size: 12px; font-weight: 600; }
    .calendar-stat-note { color: #397b9d; font-size: 10px; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
    .weekday { padding: 7px 0; color: var(--muted); font-size: 11px; }
    .day { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; border: 1px solid transparent; min-height: 49px; padding: 4px 1px; border-radius: 11px; color: var(--ink); font-weight: 600; }
    .day.level-0 { background: #f0f3f5; color: #6e7c84; }
    .day.level-1 { background: #fce8e6; color: #8a3e36; }
    .day.level-2 { background: #9fd2e8; color: #194e66; }
    .day.level-3 { background: #176f96; color: #fff; }
    .day.level-today { background: #eaf5fa; color: #315e76; }
    .day.outside { opacity: .38; }
    .day.selected { outline: 2px solid #155f82; outline-offset: 1px; }
    .day.today { border-color: #287fa5; }
    .settings-group { margin-top: 12px; }
    .calendar-surface { padding: 10px; }
    .settings-group h2 { margin-bottom: 10px; }
    .field { display: grid; gap: 6px; margin: 12px 0; }
    .field label { color: #52616b; font-size: 12px; font-weight: 600; }
    .field input, .field select { width: 100%; min-height: 45px; padding: 0 12px; border: 1px solid var(--line); border-radius: 11px; background: white; color: var(--ink); }
    .quantity-stepper { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 6px; align-items: center; }
    .quantity-stepper button { min-height: 44px; border: 1px solid var(--line); border-radius: 11px; background: white; color: var(--ink); font-size: 20px; font-weight: 700; }
    .quantity-stepper button:disabled { opacity: .4; cursor: default; }
    .quantity-stepper input { min-width: 0; }
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .food-manage { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
    .food-manage:first-of-type { border-top: 0; }
    .modal-backdrop { position: fixed; z-index: 5; inset: 0; display: flex; align-items: end; justify-content: center; background: rgba(22,34,43,.35); opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility 0s linear .2s; }
    .modal-backdrop.open { opacity: 1; visibility: visible; transition: opacity .2s ease, visibility 0s; }
    .sheet { width: min(480px, 100%); max-height: 90vh; overflow: auto; padding: 20px 18px calc(22px + env(safe-area-inset-bottom)); background: #fff; border-radius: 24px 24px 0 0; transform: translateY(20px); opacity: .72; transition: transform .24s ease-out, opacity .18s ease-out; }
    .modal-backdrop.open .sheet { transform: translateY(0); opacity: 1; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sheet-head h2 { font-size: 19px; }
    .sheet-actions { display: flex; gap: 9px; margin-top: 16px; }
    .sheet-actions > * { flex: 1; }
    .notice { padding: 10px 12px; border-radius: 12px; color: #4d6475; background: var(--green-soft); font-size: 12px; margin: 11px 0; }
    .choice-list { display: grid; gap: 8px; max-height: 43vh; overflow: auto; }
    .choice { display: flex; justify-content: space-between; gap: 10px; align-items: center; text-align: left; width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 13px; background: white; }
    .choice small { color: var(--muted); }
    .toast { position: fixed; z-index: 8; left: 50%; bottom: 83px; transform: translate(-50%, 10px); background: #26333d; color: white; border-radius: 99px; padding: 10px 15px; font-size: 13px; opacity: 0; pointer-events: none; transition: .18s; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .screen-note { margin-top: 12px; color: var(--muted); font-size: 12px; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(37,136,178,.3); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .screen.enter-next, .screen.enter-previous, .screen.leave-next, .screen.leave-previous { animation-duration: 1ms !important; } .sheet { transition-duration: 1ms !important; } }
    @media (min-width: 600px) { .app { padding-top: 30px; } .modal-backdrop { align-items: center; padding: 20px; } .sheet { border-radius: 24px; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline"><img class="topline-brand-icon" src="../app/src/main/res/drawable-nodpi/noshnote_symbol.png" alt=""><span class="topline-brand-name">NoshNote</span><div class="brand" id="app-bar-title">오늘 기록</div></header>

    <div class="screen-stack">
    <section id="home" class="screen active" aria-labelledby="app-bar-title">
      <div class="date-switch"><button class="icon-btn" id="prev-day" aria-label="이전 날짜">‹</button><strong id="home-date"></strong><button class="icon-btn" id="next-day" aria-label="다음 날짜">›</button><button class="secondary" id="go-today" style="margin-left:auto;min-height:36px;padding:0 11px;font-size:12px">오늘</button></div>
      <div class="card summary" id="summary"></div>
      <div class="section-head"><h2>기록</h2><span class="subtle" id="day-total"></span></div>
      <div class="home-actions">
        <button class="primary" id="quick-add"><span class="action-icon" aria-hidden="true">＋</span><span>바로 기록</span></button>
        <button class="load-food-btn" id="use-saved-food"><span class="action-icon" aria-hidden="true">≡</span><span>음식 불러오기</span></button>
      </div>
      <div id="entries"></div>
    </section>

    <section id="calendar-screen" class="screen" aria-labelledby="app-bar-title">
      <div class="calendar-stats" id="calendar-stats"></div>
      <div class="toolbar"><button class="icon-btn" id="prev-month" aria-label="이전 달">‹</button><button class="month-label" id="month-label" aria-label="월 선택"></button><button class="icon-btn" id="next-month" aria-label="다음 달">›</button></div>
      <div class="card calendar-surface"><div id="calendar" class="calendar"></div></div>
    </section>

    <section id="settings" class="screen" aria-labelledby="app-bar-title">
      <form id="goal-form" class="card settings-group">
        <h2>일일 목표</h2>
        <div class="input-row">
          <div class="field"><label for="goal-kcal">칼로리 (kcal)</label><input id="goal-kcal" type="number" min="1" step="1" required></div>
          <div class="field"><label for="goal-protein">단백질 (g)</label><input id="goal-protein" type="number" min="1" step="1" required></div>
        </div>
        <button class="primary wide" type="submit">목표 저장</button>
      </form>
      <div class="settings-group card">
        <div class="section-head" style="margin:0 0 8px"><h2>내 음식</h2><button class="primary" id="new-food" style="min-height:36px;padding:0 11px;font-size:12px">음식 등록</button></div>
        <div id="food-list"></div>
      </div>
    </section>
    </div>
  </main>

  <nav class="nav" aria-label="주요 메뉴">
    <button class="active" data-screen="home"><span>⌂</span>홈</button>
    <button data-screen="calendar-screen"><span>▦</span>달력</button>
    <button data-screen="settings"><span>⚙</span>설정</button>
  </nav>

  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="sheet" id="sheet"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    (() => {
      const STORAGE_KEY = 'meal-tracker-data-v1';
      const tags = ['아침', '점심', '저녁', '간식'];
      const today = dateKey(new Date());
      let state = loadState();
      let selectedDate = today;
      let shownMonth = new Date();
      let editingFoodId = null;

      function dateKey(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
      function parseDate(key) { const [y,m,d] = key.split('-').map(Number); return new Date(y,m-1,d); }
      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && saved.foods && saved.entries) {
            saved.foods = saved.foods.map(food => {
              const oldAmount = Number(food.base) || 1;
              return { id: food.id, name: food.name, unit: food.unit, kcal: Number(food.kcal) / oldAmount, protein: Number(food.protein) / oldAmount };
            });
            return saved;
          }
        } catch (_) {}
        return { goals: { kcal: 1900, protein: 140 }, foods: [], entries: [] };
      }
      function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      function escapeHtml(value) { return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
      function fmt(value, digits=1) { return Number(value).toLocaleString('ko-KR', { maximumFractionDigits: digits }); }
      function dateLabel(key) { const d = parseDate(key); return `${d.getMonth()+1}월 ${d.getDate()}일 (${['일','월','화','수','목','금','토'][d.getDay()]})`; }
      function entriesFor(key) { return state.entries.filter(entry => entry.date === key); }
      function totalsFor(key) { return entriesFor(key).reduce((sum, entry) => ({ kcal: sum.kcal + entry.kcal, protein: sum.protein + entry.protein }), { kcal: 0, protein: 0 }); }

      function render() { renderHome(); renderCalendar(); renderSettings(); updateAppBarTitle(); }
      function renderHome() {
        document.getElementById('home-date').textContent = dateLabel(selectedDate);
        const totals = totalsFor(selectedDate);
        const kcalGoal = Number(state.goals.kcal) || 0;
        const proteinGoal = Number(state.goals.protein) || 0;
        const metrics = [
          { name: '칼로리', value: totals.kcal, goal: kcalGoal, unit: 'kcal', cls: '' },
          { name: '단백질', value: totals.protein, goal: proteinGoal, unit: 'g', cls: 'protein' }
        ];
        document.getElementById('summary').innerHTML = `<div class="summary-title">영양 섭취량</div>${metrics.map(metric => {
          const pct = metric.goal ? Math.min(100, metric.value / metric.goal * 100) : 0;
          const remaining = Math.max(metric.goal - metric.value, 0);
          return `<div><div class="metric-top"><span class="metric-name">${metric.name}</span><span class="metric-value">${fmt(metric.value)} / ${fmt(metric.goal,0)} ${metric.unit}</span></div><div class="track"><div class="fill ${metric.cls}" style="width:${pct}%"></div></div><div class="remaining"><span>목표 ${Math.round(pct)}%</span><span>${metric.name === '칼로리' ? '남은' : '부족한'} ${fmt(remaining)}${metric.unit}</span></div></div>`;
        }).join('')}`;
        document.getElementById('day-total').textContent = `${fmt(totals.kcal,0)} kcal · ${fmt(totals.protein)} g`;
        const items = entriesFor(selectedDate).slice().sort((a,b) => (a.eatenAt || '00:00').localeCompare(b.eatenAt || '00:00') || (a.createdAt || '').localeCompare(b.createdAt || ''));
        const groups = [];
        items.forEach(item => {
          const tag = item.tag || '태그 없음';
          const lastGroup = groups[groups.length - 1];
          if (lastGroup && lastGroup.tag === tag) lastGroup.items.push(item);
          else groups.push({ tag, items: [item] });
        });
        document.getElementById('entries').innerHTML = items.length ? groups.map(group => `<section class="entry-group"><h3 class="entry-group-title">${escapeHtml(group.tag)}</h3><div class="entry-group-list">${group.items.map(item => `<article class="entry-card"><div class="food-row entry-row"><time class="subtle entry-time">${escapeHtml(item.eatenAt || '12:00')}</time><div class="food-info"><strong>${escapeHtml(item.name)}</strong><small>${fmt(item.quantity)} ${escapeHtml(item.unit || '')} · 단백질 ${fmt(item.protein)}g</small></div><div class="food-kcal">${fmt(item.kcal,0)} kcal</div><button class="tiny" data-edit-entry="${item.id}">수정</button></div></article>`).join('')}</div></section>`).join('') : `<div class="card empty" style="text-align:center;padding:22px">아직 기록이 없어요.<br><span class="subtle">음식을 등록하지 않아도 바로 기록할 수 있어요.</span></div>`;
        document.querySelectorAll('[data-edit-entry]').forEach(button => button.addEventListener('click', () => openEntryEdit(button.dataset.editEntry)));
      }
      function renderCalendar() {
        const y = shownMonth.getFullYear(), m = shownMonth.getMonth();
        const monthPicker = document.getElementById('month-label');
        monthPicker.textContent = `${y}년 ${m+1}월　⌄`;
        const monthPrefix = `${y}-${String(m+1).padStart(2,'0')}-`;
        const loggedDays = new Set(state.entries.filter(entry => entry.date.startsWith(monthPrefix)).map(entry => entry.date)).size;
        const hasLoggedToday = entriesFor(today).length > 0;
        let streakCursor = parseDate(today);
        if (!hasLoggedToday) streakCursor.setDate(streakCursor.getDate() - 1);
        let streak = 0;
        while (entriesFor(dateKey(streakCursor)).length > 0) {
          streak++;
          streakCursor.setDate(streakCursor.getDate() - 1);
        }
        const streakNote = hasLoggedToday ? '오늘 기록 완료' : (streak > 0 ? '오늘 기록하면 이어져요' : '오늘 기록을 시작해 보세요');
        document.getElementById('calendar-stats').innerHTML = `<div class="calendar-stat"><span class="calendar-stat-label">이번 달 기록</span><strong>${loggedDays}<small>일</small></strong></div><div class="calendar-stat"><span class="calendar-stat-label">연속 기록</span><strong>${streak}<small>일</small></strong><span class="calendar-stat-note">${streakNote}</span></div>`;
        const first = new Date(y,m,1), start = new Date(y,m,1-first.getDay());
        let html = ['일','월','화','수','목','금','토'].map(day => `<div class="weekday">${day}</div>`).join('');
        for (let i=0; i<42; i++) {
          const d = new Date(start); d.setDate(start.getDate()+i);
          const key = dateKey(d), inMonth = d.getMonth() === m;
          const items = entriesFor(key);
          const totals = totalsFor(key);
          let level = 0, status = '기록 없음';
          if (key === today) {
            level = 'today'; status = '오늘 진행 중';
          } else if (items.length) {
            // 지난 날짜도 설정 화면의 현재 목표로 간단히 다시 판정한다.
            const kcalOK = totals.kcal <= Number(state.goals.kcal);
            const proteinOK = totals.protein >= Number(state.goals.protein);
            const goalCount = Number(kcalOK) + Number(proteinOK);
            level = goalCount === 2 ? 3 : goalCount === 1 ? 2 : 1;
            status = goalCount === 2 ? '두 목표 모두 달성' : goalCount === 1 ? '일부 달성' : '목표 미달성';
          }
          html += `<button class="day level-${level} ${inMonth?'':'outside'} ${key===selectedDate?'selected':''} ${key===today?'today':''}" data-date="${key}" aria-label="${dateLabel(key)}, ${status}">${d.getDate()}</button>`;
        }
        document.getElementById('calendar').innerHTML = html;
        document.querySelectorAll('[data-date]').forEach(button => button.addEventListener('click', () => { selectedDate = button.dataset.date; showScreen('home'); render(); }));
      }
      function renderSettings() {
        document.getElementById('goal-kcal').value = state.goals.kcal;
        document.getElementById('goal-protein').value = state.goals.protein;
        document.getElementById('food-list').innerHTML = state.foods.length ? state.foods.map(food => `<div class="food-manage"><div><strong>${escapeHtml(food.name)}</strong><div class="subtle">1 ${escapeHtml(food.unit)}당 ${fmt(food.kcal,0)} kcal · ${fmt(food.protein)}g</div></div><button class="secondary" data-edit-food="${food.id}" style="min-height:34px;padding:0 10px;font-size:12px">수정</button></div>`).join('') : `<p class="empty">등록한 음식이 아직 없어요. 자주 먹는 음식부터 추가해 보세요.</p>`;
        document.querySelectorAll('[data-edit-food]').forEach(button => button.addEventListener('click', () => openFoodForm(button.dataset.editFood)));
      }
      function showScreen(id) {
        const nextScreen = document.getElementById(id);
        const previousScreen = document.querySelector('.screen.active');
        const routes = ['home', 'calendar-screen', 'settings'];
        const movingForward = routes.indexOf(id) >= routes.indexOf(previousScreen?.id);
        if (previousScreen !== nextScreen) {
          document.querySelectorAll('.screen.leaving').forEach(screen => screen.classList.remove('leaving', 'leave-next', 'leave-previous'));
          const enterClass = movingForward ? 'enter-next' : 'enter-previous';
          const leaveClass = movingForward ? 'leave-next' : 'leave-previous';
          previousScreen?.classList.remove('active', 'enter-next', 'enter-previous');
          previousScreen?.classList.add('leaving', leaveClass);
          nextScreen?.classList.remove('enter-next', 'enter-previous', 'leave-next', 'leave-previous', 'leaving');
          nextScreen?.classList.add('active', enterClass);
          if (previousScreen) {
            const finishLeave = event => {
              if (event.target !== previousScreen) return;
              previousScreen.classList.remove('leaving', leaveClass);
              previousScreen.removeEventListener('animationend', finishLeave);
            };
            previousScreen.addEventListener('animationend', finishLeave);
          }
          if (nextScreen) {
            const finishEnter = event => {
              if (event.target !== nextScreen) return;
              nextScreen.classList.remove(enterClass);
              nextScreen.removeEventListener('animationend', finishEnter);
            };
            nextScreen.addEventListener('animationend', finishEnter);
          }
        }
        document.querySelectorAll('.nav button').forEach(button => button.classList.toggle('active', button.dataset.screen === id));
        updateAppBarTitle();
      }
      function updateAppBarTitle() {
        const activeId = document.querySelector('.screen.active')?.id || 'home';
        const title = activeId === 'calendar-screen' ? '달력' : activeId === 'settings' ? '설정' : '식단 기록';
        document.getElementById('app-bar-title').textContent = title;
      }
      function openModal(html) { document.getElementById('sheet').innerHTML = html; document.getElementById('modal').classList.add('open'); }
      function closeModal() { document.getElementById('modal').classList.remove('open'); }
      function nowTime() { const d = new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
      function inferMealTag(time) {
        const [hour, minute] = (time || nowTime()).split(':').map(Number);
        const minutes = hour * 60 + minute;
        if (minutes >= 300 && minutes < 660) return '아침';
        if (minutes >= 660 && minutes < 960) return '점심';
        if (minutes >= 960 && minutes < 1320) return '저녁';
        return '간식';
      }
      function bindTimeTag(timeId, tagId, wasManuallySet) {
        const timeInput = document.getElementById(timeId), tagInput = document.getElementById(tagId);
        let manual = wasManuallySet;
        tagInput.onchange = () => { manual = true; };
        timeInput.oninput = () => { if (!manual) tagInput.value = inferMealTag(timeInput.value); };
        return () => manual;
      }
      function tagOptions(selected='') { return `<option value="">태그 없음</option>${tags.map(tag => `<option value="${tag}" ${tag===selected?'selected':''}>${tag}</option>`).join('')}`; }
      function openFoodPicker() {
        if (!state.foods.length) { openDirectForm(); return; }
        const choices = state.foods.map(food => `<button class="choice" data-choose-food="${food.id}"><span><strong>${escapeHtml(food.name)}</strong><br><small>1 ${escapeHtml(food.unit)}당 · ${fmt(food.kcal,0)} kcal / ${fmt(food.protein)}g</small></span><span>›</span></button>`).join('');
        openModal(`<div class="sheet-head"><h2 id="modal-title">등록 음식 불러오기</h2><button class="icon-btn" data-close aria-label="닫기">×</button></div><div class="field"><label for="food-search">음식 검색</label><input id="food-search" placeholder="음식 이름 검색" autocomplete="off"></div><div class="choice-list">${choices}</div><div class="sheet-actions"><button class="secondary" id="direct-from-picker">바로 기록</button><button class="secondary" data-close>닫기</button></div>`);
        document.querySelectorAll('[data-close]').forEach(button => button.onclick = closeModal);
        document.getElementById('direct-from-picker').onclick = () => openDirectForm();
        document.querySelectorAll('[data-choose-food]').forEach(button => button.onclick = () => openTemplateEntryForm(button.dataset.chooseFood));
        document.getElementById('food-search').oninput = event => document.querySelectorAll('[data-choose-food]').forEach(button => { button.hidden = !button.textContent.toLowerCase().includes(event.target.value.toLowerCase()); });
      }
      function openDirectForm(entryId=null) {
        const entry = entryId ? state.entries.find(item => item.id === entryId) : null;
        const time = entry?.eatenAt || nowTime();
        const initialTag = entry ? (entry.tag ?? inferMealTag(time)) : inferMealTag(time);
        let tagManuallySet = entry ? (entry.tagSource ? entry.tagSource === 'manual' : Boolean(entry.tag)) : false;
        openModal(`<div class="sheet-head"><h2 id="modal-title">${entry ? '기록 수정' : '바로 기록'}</h2><button class="icon-btn" data-close aria-label="닫기">×</button></div><form id="direct-form"><div class="field"><label for="direct-name">음식 이름</label><input id="direct-name" required value="${escapeHtml(entry?.name || '')}" placeholder="예: 닭가슴살"></div><div class="input-row"><div class="field"><label for="direct-quantity">이번에 먹은 양</label><input id="direct-quantity" type="number" min="0.01" step="any" required value="${entry?.quantity ?? 1}"></div><div class="field"><label for="direct-unit">단위</label><input id="direct-unit" value="${escapeHtml(entry?.unit || '인분')}" placeholder="g, 개, 인분"></div></div><div class="notice">아래 영양값은 기준량이 아니라 이번에 먹은 전체 양의 값이에요.</div><div class="input-row"><div class="field"><label for="direct-kcal">칼로리 (kcal)</label><input id="direct-kcal" type="number" min="0" step="any" required value="${entry?.kcal ?? ''}"></div><div class="field"><label for="direct-protein">단백질 (g)</label><input id="direct-protein" type="number" min="0" step="any" required value="${entry?.protein ?? ''}"></div></div><div class="input-row"><div class="field"><label for="direct-time">먹은 시간</label><input id="direct-time" type="time" required value="${time}"></div><div class="field"><label for="direct-tag">식사 태그 (자동 선택·수정 가능)</label><select id="direct-tag">${tagOptions(initialTag)}</select></div></div>${entry ? '' : '<label style="display:flex;align-items:center;gap:9px;margin-top:8px;font-size:13px"><input id="save-template" type="checkbox"> 다음에도 쓰도록 음식 목록에 저장</label>'}<div class="sheet-actions">${entry ? '<button type="button" class="danger-btn" id="delete-entry">기록 삭제</button>' : '<button type="button" class="secondary" data-close>취소</button>'}<button class="primary" type="submit">${entry ? '변경 저장' : '기록 추가'}</button></div></form>`);
        document.querySelectorAll('[data-close]').forEach(button => button.onclick = closeModal);
        const wasTagManuallySet = bindTimeTag('direct-time', 'direct-tag', tagManuallySet);
        const directNutritionFields = document.getElementById('direct-kcal').closest('.input-row');
        const nutritionOcrButton = document.createElement('button');
        nutritionOcrButton.type = 'button';
        nutritionOcrButton.className = 'secondary wide';
        nutritionOcrButton.textContent = '성분표에서 값 가져오기';
        const nutritionOcrNote = document.createElement('p');
        nutritionOcrNote.className = 'subtle';
        nutritionOcrNote.textContent = '프로토타입에서는 예시값을 입력해요.';
        directNutritionFields.after(nutritionOcrButton, nutritionOcrNote);
        nutritionOcrButton.onclick = () => {
          document.getElementById('direct-kcal').value = '120';
          document.getElementById('direct-protein').value = '18';
          nutritionOcrNote.textContent = '예시 결과(1회 제공량 100g)를 입력했어요. 실제 카메라 OCR은 Android 앱에서 동작해요.';
        };
        document.getElementById('direct-form').onsubmit = event => {
          event.preventDefault();
          const quantity = Number(document.getElementById('direct-quantity').value);
          const kcal = Number(document.getElementById('direct-kcal').value);
          const protein = Number(document.getElementById('direct-protein').value);
          const name = document.getElementById('direct-name').value.trim();
          const unit = document.getElementById('direct-unit').value.trim() || '인분';
          const eatenAt = document.getElementById('direct-time').value;
          const tag = document.getElementById('direct-tag').value;
          if (!name || !(quantity > 0) || kcal < 0 || protein < 0 || !eatenAt) { toast('입력한 값을 확인해 주세요.'); return; }
          let foodId = entry?.foodId || null;
          if (!entry && document.getElementById('save-template')?.checked) {
            const food = { id: crypto.randomUUID(), name, unit, kcal: kcal / quantity, protein: protein / quantity };
            state.foods.push(food); foodId = food.id;
          }
          const data = { name, quantity, unit, kcal, protein, caloriesPerUnitKcalSnapshot: kcal / quantity, proteinPerUnitGSnapshot: protein / quantity, eatenAt, tag, tagSource: wasTagManuallySet() ? 'manual' : 'auto', foodId };
          if (entry) Object.assign(entry, data);
          else state.entries.push({ id: crypto.randomUUID(), date: selectedDate, ...data, createdAt: new Date().toISOString() });
          save(); closeModal(); render(); toast(entry ? '기록을 수정했어요.' : '기록했어요.');
        };
        const del = document.getElementById('delete-entry');
        if (del) del.onclick = () => { state.entries = state.entries.filter(item => item.id !== entryId); save(); closeModal(); render(); toast('기록을 삭제했어요.'); };
      }
      function openTemplateEntryForm(foodId) {
        const food = state.foods.find(item => item.id === foodId);
        if (!food) return;
        const eatenAt = nowTime();
        openModal(`<div class="sheet-head"><h2 id="modal-title">${escapeHtml(food.name)} 기록</h2><button class="icon-btn" data-close aria-label="닫기">×</button></div><div class="notice">1 ${escapeHtml(food.unit)}당 ${fmt(food.kcal,0)} kcal · 단백질 ${fmt(food.protein)}g</div><div class="field"><label for="template-quantity">이번에 먹은 개수 / 수량 (${escapeHtml(food.unit)})</label><div class="quantity-stepper"><button type="button" id="template-quantity-decrease" aria-label="수량 줄이기">−</button><input id="template-quantity" type="number" min="0.01" step="any" value="1"><button type="button" id="template-quantity-increase" aria-label="수량 늘리기">＋</button></div></div><div class="input-row"><div class="field"><label for="template-time">먹은 시간</label><input id="template-time" type="time" value="${eatenAt}"></div><div class="field"><label for="template-tag">식사 태그 (자동 선택·수정 가능)</label><select id="template-tag">${tagOptions(inferMealTag(eatenAt))}</select></div></div><div class="notice" id="template-preview"></div><div class="sheet-actions"><button class="secondary" data-close>취소</button><button class="primary" id="save-template-entry">기록 추가</button></div>`);
        document.querySelectorAll('[data-close]').forEach(button => button.onclick = closeModal);
        const tagManuallySet = bindTimeTag('template-time', 'template-tag', false);
        const quantityInput = document.getElementById('template-quantity');
        const decreaseQuantity = document.getElementById('template-quantity-decrease');
        const increaseQuantity = document.getElementById('template-quantity-increase');
        const update = () => {
          const quantity = Number(quantityInput.value) || 0;
          document.getElementById('template-preview').textContent = `이번 섭취량 · ${fmt(quantity*food.kcal,0)} kcal · 단백질 ${fmt(quantity*food.protein)}g`;
          decreaseQuantity.disabled = !(quantity > 1);
        };
        quantityInput.oninput = update;
        increaseQuantity.onclick = () => { quantityInput.value = String(Math.max(0, Number(quantityInput.value) || 0) + 1); update(); };
        decreaseQuantity.onclick = () => { const quantity = Number(quantityInput.value); if (quantity > 1) { quantityInput.value = String(quantity - 1); update(); } };
        update();
        document.getElementById('save-template-entry').onclick = () => {
          const quantity = Number(document.getElementById('template-quantity').value);
          if (!(quantity > 0)) { toast('수량을 확인해 주세요.'); return; }
          state.entries.push({ id: crypto.randomUUID(), date: selectedDate, eatenAt: document.getElementById('template-time').value, tag: document.getElementById('template-tag').value, tagSource: tagManuallySet() ? 'manual' : 'auto', foodId: food.id, name: food.name, quantity, unit: food.unit, caloriesPerUnitKcalSnapshot: food.kcal, proteinPerUnitGSnapshot: food.protein, kcal: quantity*food.kcal, protein: quantity*food.protein, createdAt: new Date().toISOString() });
          save(); closeModal(); render(); toast('기록했어요.');
        };
      }
      function openEntryEdit(id) { if (state.entries.some(item => item.id === id)) openDirectForm(id); }
      function openFoodForm(foodId=null) {
        editingFoodId = foodId;
        const food = state.foods.find(item => item.id === foodId);
        openModal(`<div class="sheet-head"><h2 id="modal-title">${food ? '음식 수정' : '음식 등록'}</h2><button class="icon-btn" data-close aria-label="닫기">×</button></div><form id="food-form"><div class="field"><label for="food-name">음식 이름</label><input id="food-name" required value="${escapeHtml(food?.name || '')}" placeholder="예: 계란"></div><div class="field"><label for="food-unit">기록 단위</label><input id="food-unit" required value="${escapeHtml(food?.unit || '개')}" placeholder="개, 스쿱, 100g, 팩"></div><div class="input-row"><div class="field"><label for="food-kcal">단위당 칼로리 (kcal)</label><input id="food-kcal" type="number" min="0" step="any" required value="${food?.kcal ?? ''}"></div><div class="field"><label for="food-protein">단위당 단백질 (g)</label><input id="food-protein" type="number" min="0" step="any" required value="${food?.protein ?? ''}"></div></div><div class="notice">등록할 때 수량은 입력하지 않아요. 식단에 불러와 기록할 때 먹은 양을 입력해요.</div><div class="sheet-actions"><button type="button" class="secondary" data-close>취소</button><button type="submit" class="primary">저장</button></div></form>${food ? '<button class="danger-btn wide" id="delete-food" style="margin-top:9px">음식 삭제</button>' : ''}`);
        document.querySelectorAll('[data-close]').forEach(button => button.onclick = closeModal);
        document.getElementById('food-form').onsubmit = event => {
          event.preventDefault();
          const data = { name: document.getElementById('food-name').value.trim(), unit: document.getElementById('food-unit').value.trim(), kcal: Number(document.getElementById('food-kcal').value), protein: Number(document.getElementById('food-protein').value) };
          if (!data.name || !data.unit || data.kcal < 0 || data.protein < 0) { toast('입력한 값을 확인해 주세요.'); return; }
          if (food) Object.assign(food, data); else state.foods.push({ id: crypto.randomUUID(), ...data });
          save(); closeModal(); render();
          toast(food ? '음식 정보를 수정했어요.' : '재사용 음식으로 저장했어요.');
        };
        const deleteButton = document.getElementById('delete-food');
        if (deleteButton) deleteButton.onclick = () => {
          if (!confirm('음식을 목록에서 삭제할까요? 기존 식단 기록은 유지됩니다.')) return;
          state.foods = state.foods.filter(item => item.id !== foodId); save(); closeModal(); render(); toast('음식을 삭제했어요.');
        };
      }
      function toast(message) { const el = document.getElementById('toast'); el.textContent = message; el.classList.add('show'); clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.remove('show'), 1900); }

      document.querySelectorAll('.nav button').forEach(button => button.addEventListener('click', () => { showScreen(button.dataset.screen); render(); }));
      document.getElementById('prev-day').onclick = () => { const d = parseDate(selectedDate); d.setDate(d.getDate()-1); selectedDate = dateKey(d); render(); };
      document.getElementById('next-day').onclick = () => { const d = parseDate(selectedDate); d.setDate(d.getDate()+1); selectedDate = dateKey(d); render(); };
      document.getElementById('go-today').onclick = () => { selectedDate = today; render(); };
      document.getElementById('prev-month').onclick = () => { shownMonth = new Date(shownMonth.getFullYear(), shownMonth.getMonth()-1, 1); renderCalendar(); };
      document.getElementById('next-month').onclick = () => { shownMonth = new Date(shownMonth.getFullYear(), shownMonth.getMonth()+1, 1); renderCalendar(); };
      document.getElementById('month-label').onclick = () => {
        const years = Array.from({length:201}, (_, i) => i + 1900);
        const yearOptions = years.map(year => `<option value="${year}">${year}년</option>`).join('');
        const monthOptions = Array.from({length:12}, (_, i) => `<option value="${i+1}">${i+1}월</option>`).join('');
        openModal(`<div class="sheet-head"><h2 id="modal-title">월 선택</h2><button class="icon-btn" data-close aria-label="닫기">×</button></div><div class="input-row"><div class="field"><label for="picker-year">연도</label><select id="picker-year">${yearOptions}</select></div><div class="field"><label for="picker-month">월</label><select id="picker-month">${monthOptions}</select></div></div><div class="sheet-actions"><button class="secondary" data-close>취소</button><button class="primary" id="apply-month">이 달 보기</button></div>`);
        document.getElementById('picker-year').value = String(shownMonth.getFullYear());
        document.getElementById('picker-month').value = String(shownMonth.getMonth()+1);
        document.querySelectorAll('[data-close]').forEach(button => button.onclick = closeModal);
        document.getElementById('apply-month').onclick = () => {
          const year = Number(document.getElementById('picker-year').value);
          const month = Number(document.getElementById('picker-month').value);
          shownMonth = new Date(year, month-1, 1);
          closeModal();
          renderCalendar();
        };
      };
      let swipeStartX = null;
      document.querySelector('.app').addEventListener('touchstart', event => {
        if (event.target.closest('button,input,select,textarea,.nav,.modal-backdrop')) { swipeStartX = null; return; }
        swipeStartX = event.changedTouches[0].clientX;
      }, { passive: true });
      document.querySelector('.app').addEventListener('touchend', event => {
        if (swipeStartX == null) return;
        const delta = event.changedTouches[0].clientX - swipeStartX;
        swipeStartX = null;
        if (Math.abs(delta) < 60) return;
        const activeId = document.querySelector('.screen.active')?.id || 'home';
        const routes = ['home','calendar-screen','settings'];
        const next = routes[routes.indexOf(activeId) + (delta < 0 ? 1 : -1)];
        if (next) { showScreen(next); render(); }
      }, { passive: true });
      document.getElementById('goal-form').onsubmit = event => {
        event.preventDefault();
        const kcal = Number(document.getElementById('goal-kcal').value), protein = Number(document.getElementById('goal-protein').value);
        if (!(kcal > 0) || !(protein > 0)) { toast('목표는 0보다 큰 값으로 입력해 주세요.'); return; }
        state.goals = { kcal, protein }; save(); render(); toast('목표를 저장했어요.');
      };
      document.getElementById('quick-add').onclick = () => openDirectForm();
      document.getElementById('use-saved-food').onclick = () => openFoodPicker();
      document.getElementById('new-food').onclick = () => openFoodForm();
      document.getElementById('modal').addEventListener('click', event => { if (event.target.id === 'modal') closeModal(); });
      document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
      render();
    })();
  </script>
</body>
</html>
