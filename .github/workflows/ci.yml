name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Android 검증
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 빌드 환경 준비
        uses: ./.github/actions/android-build

      - name: 배포 중단 조건 검증
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: 단위 테스트 · Lint · Debug 및 Release 빌드
        run: >-
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease
          :app:assembleDebug :app:assembleRelease :app:bundleRelease
          --no-daemon --no-configuration-cache --stacktrace

      - name: 검증 보고서 보관
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

      - name: 개발 확인용 Debug APK 보관
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: debug-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
